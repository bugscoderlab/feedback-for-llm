name: Release Firefox extension

# Builds the "Feedback for LLM" extension, signs it through AMO's unlisted
# channel, attaches the signed .xpi to a GitHub Release, and refreshes the
# self-hosted update manifest on the gh-pages branch.
#
# Users install the signed .xpi once; from then on Firefox polls
# release.config.json → updateUrl (served from gh-pages) and updates itself
# from the GitHub Release asset.
#
# Trigger: push a tag matching the version in src/manifest.json
#     git tag v1.1.0 && git push origin v1.1.0
#
# Or run it by hand (Actions → Release Firefox extension → Run workflow).
# workflow_dispatch exists because a tag-triggered run executes the workflow AS
# IT EXISTED ON THAT TAG: fixing the workflow without moving the tag changes
# nothing, and re-running replays the original commit. This lets you re-release
# the current main without moving tags. Set `tag` to also publish a GitHub
# Release under that tag; leave it blank to publish artifacts only.
#
# One-time setup (secrets, Pages, AMO keys): see README.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.0). Blank = artifacts only, no Release."
        required: false
        default: ""
      dry_run:
        description: "Dry run: build and lint only, skip signing and publishing."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build extension bundle
        run: node build.mjs

      - name: Read build info
        id: info
        run: |
          node -e "const i=require('./dist/build-info.json'); for (const k of ['version','artifactBase','addonId','channel']) console.log(k+'='+i[k])" >> "$GITHUB_OUTPUT"

      - name: Lint built bundle
        # --self-hosted allows the gecko.update_url that AMO-listed builds cannot have.
        run: npx --yes web-ext@10 lint --self-hosted --source-dir "dist/${{ steps.info.outputs.artifactBase }}" --output text

      - name: Resolve release tag
        id: rel
        # One place that decides which tag this run releases under.
        # - tag push  → the pushed tag (validated against the manifest below)
        # - manual    → the `tag` input, or blank for an artifacts-only run
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        if: steps.rel.outputs.tag != ''
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          if [ "${tag#v}" != "${{ steps.info.outputs.version }}" ]; then
            echo "::error::tag $tag does not match manifest version ${{ steps.info.outputs.version }}"
            exit 1
          fi

      - name: Sign with AMO (unlisted)
        id: sign
        if: ${{ !inputs.dry_run }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npx --yes web-ext@10 sign \
            --channel=unlisted \
            --source-dir "dist/${{ steps.info.outputs.artifactBase }}" \
            --artifacts-dir dist/signed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --approval-timeout 900000 \
            --no-input

      - name: Normalize signed artifact name
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          xpi="$(find dist/signed -maxdepth 1 -name '*.xpi' | head -n1)"
          if [ -z "$xpi" ]; then
            echo "::error::web-ext sign produced no .xpi (submission may still be awaiting AMO review)"
            exit 1
          fi
          mv "$xpi" "dist/signed/${{ steps.info.outputs.artifactBase }}-${{ steps.info.outputs.version }}.xpi"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run && steps.rel.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          xpi="dist/signed/${{ steps.info.outputs.artifactBase }}-${{ steps.info.outputs.version }}.xpi"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$xpi" --clobber
          else
            gh release create "$tag" "$xpi" \
              --title "$tag" \
              --notes "Feedback for LLM $tag - signed, self-updating Firefox extension."
          fi

      - name: Generate update manifest
        if: ${{ !inputs.dry_run && steps.rel.outputs.tag != '' }}
        run: node gen-updates.mjs "${{ steps.info.outputs.version }}" "${{ steps.rel.outputs.tag }}"

      - name: Publish update manifest to gh-pages
        if: ${{ !inputs.dry_run && steps.rel.outputs.tag != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/pages
          enable_jekyll: false
          force_orphan: true

      - name: Keep dry-run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ steps.info.outputs.version }}
          path: dist/
          retention-days: 7
